services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workforcepro
      POSTGRES_USER: workforcepro
      POSTGRES_PASSWORD: workforcepro
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforcepro -d workforcepro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      APP_URL: http://localhost:18000
      FRONTEND_URL: http://localhost:3001
      SANCTUM_STATEFUL_DOMAINS: localhost:3001,127.0.0.1:3001
    ports:
      - "18000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=120"]
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      backend:
        condition: service_started

  scheduler:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:18000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:18000
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
  backend-vendor:
